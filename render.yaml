services:
  - type: web
    name: maya-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_URL
        value:       value: https://mayaachatbot.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MONGO_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: STICKER_PACK
        sync: false
      - key: STICKER_CHANCE
        value: "0.6"
      - key: VOICE_NAME
        value: hi-IN-SwaraNeural
      - key: VOICE_CHANCE
        value: "0.15"
      - key: VOICE_GAP
        value: "10"
      - key: ADMIN_ID
        value: "8536757095"
      - key: VOICE_ENABLED
        value: "1"
